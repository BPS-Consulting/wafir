name: Publish Bridge App

on:
  push:
    tags:
      - "wafir@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  publish-bridge:
    name: Publish Bridge to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#wafir@}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install turbo
        run: pnpm add -g turbo

      - name: Prune Monorepo
        run: turbo prune bridge --docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        run: |
          echo "IMAGE_ID=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_ID }}/bridge:latest
            ghcr.io/${{ env.IMAGE_ID }}/bridge:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
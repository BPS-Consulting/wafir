name: Publish Wafir Widget

on:
  push:
    tags:
      - "wafir@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch all history for turbo caching/git tags if needed
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        # Install from root to link workspace packages correctly
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#wafir@}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        # Use -C or --prefix to target the specific package from root
        run: pnpm --filter wafir exec npm pkg set version=${{ steps.version.outputs.version }}

      - name: Build package (and dependencies)
        # Use turbo filter. The "..." includes all local dependencies of wafir
        run: pnpm turbo run build --filter=wafir...

      - name: Publish to NPM
        # Use --filter to publish the specific package
        run: pnpm --filter wafir publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Path is relative to root since we aren't using defaults:run
          DIST_PATH="packages/wafir/dist/iife/wafir.js"

          # Upload versioned file
          aws s3 cp $DIST_PATH "s3://${{ secrets.S3_BUCKET }}/wafir/${VERSION}/wafir.js" \
            --content-type "application/javascript" \
            --cache-control "public, max-age=31536000, immutable"

          # Also upload as latest
          aws s3 cp $DIST_PATH "s3://${{ secrets.S3_BUCKET }}/wafir/latest/wafir.js" \
            --content-type "application/javascript" \
            --cache-control "public, max-age=3600"
